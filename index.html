<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909"><meta name="description" content="AetherPanel — a multi-platform game server control plane and node agent.">
<title>AetherPanel — Control your infrastructure</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--bg:#090909;--panel:#101010;--panel2:#151515;--line:#27231f;--text:#f4f1ed;--muted:#a39b93;--orange:#ff791f;--orange2:#ff9a50;--mono:'DM Mono',monospace;--sans:'Manrope',sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px}a{color:inherit;text-decoration:none}button{font:inherit}
.shell{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:258px;border-right:1px solid var(--line);padding:25px 17px;background:#0b0b0b;display:flex;flex-direction:column;z-index:5}.brand{display:flex;align-items:center;gap:11px;padding:0 12px 32px;font-weight:800;font-size:17px;letter-spacing:-.5px}.mark{width:28px;height:28px;border-radius:8px;background:var(--orange);display:grid;place-items:center;color:#111;font-weight:900;font-size:16px;box-shadow:0 0 24px #ff791f30}.nav-label{font:11px var(--mono);color:#8e8176;text-transform:uppercase;letter-spacing:1.5px;padding:17px 12px 9px}.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:8px;color:#bdb6af;margin:2px 0;transition:.2s}.nav a:hover,.nav a.active{background:#21170f;color:#fff}.nav a.active{box-shadow:inset 2px 0 var(--orange)}.nav .ico{width:18px;color:var(--orange);font:14px var(--mono)}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:18px 12px 0;color:#887f76;font:11px var(--mono);line-height:1.8}.side-bottom a{color:var(--orange2)}
main{margin-left:258px;min-height:100vh}.topbar{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw;position:sticky;top:0;background:#090909eF;backdrop-filter:blur(14px);z-index:4}.crumb{font:12px var(--mono);color:var(--muted)}.crumb b{color:var(--orange);font-weight:400}.top-actions{display:flex;gap:10px;align-items:center}.pill{font:10px var(--mono);border:1px solid #3b2b20;border-radius:99px;padding:7px 11px;color:#ffb27e}.github{border:1px solid var(--line);padding:9px 13px;border-radius:7px;font-size:12px;color:#d7d0c9}.mobile-menu{display:none;background:none;border:1px solid var(--line);color:white;border-radius:7px;padding:8px}
.content{max-width:1280px;margin:auto;padding:62px 5vw 100px}.eyebrow{font:11px var(--mono);letter-spacing:1.6px;text-transform:uppercase;color:var(--orange);display:flex;align-items:center;gap:9px}.eyebrow:before{content:'';width:20px;height:1px;background:var(--orange)}h1{font-size:clamp(46px,6vw,82px);line-height:.99;letter-spacing:-5px;margin:25px 0 24px;max-width:760px}h1 em{font-style:normal;color:var(--orange)}.lead{font-size:16px;line-height:1.8;color:#b5aea7;max-width:650px}.actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:30px}.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 17px;border-radius:8px;font-weight:700;font-size:12px;border:1px solid var(--line);transition:.2s}.btn.primary{background:var(--orange);color:#15100c;border-color:var(--orange)}.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.btn.secondary{background:#111;color:#e9e2db}.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:45px;align-items:center}.terminal{border:1px solid #34302b;border-radius:12px;background:#0e0e0e;overflow:hidden;box-shadow:0 25px 90px #0009}.terminal-head{height:43px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 15px;color:#92877d;font:10px var(--mono)}.dot{width:7px;height:7px;border-radius:50%;background:#514b45}.terminal-head span:last-child{margin-left:auto;color:var(--orange)}.terminal pre{margin:0;padding:24px 22px;color:#c7c0b8;font:12px/2 var(--mono);white-space:pre-wrap}.term-orange{color:var(--orange2)}.term-dim{color:#81776f}.section{margin-top:100px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.section h2{font-size:30px;letter-spacing:-1.4px;margin:10px 0}.muted{color:var(--muted);line-height:1.7}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{border:1px solid var(--line);border-radius:10px;padding:22px;background:linear-gradient(145deg,#13110f,#0d0d0d);min-height:180px;transition:.2s}.card:hover{border-color:#694022;transform:translateY(-3px)}.card-icon{width:35px;height:35px;border:1px solid #58351f;background:#21160f;color:var(--orange);border-radius:8px;display:grid;place-items:center;font:14px var(--mono);margin-bottom:24px}.card h3{font-size:15px;margin:0 0 9px}.card p{font-size:12px;color:var(--muted);line-height:1.7;margin:0}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.feature-panel{border:1px solid var(--line);border-radius:10px;padding:25px;background:#101010}.feature-panel h3{font-size:19px;margin:8px 0}.feature-panel ul{padding-left:18px;color:#b0a79f;line-height:2.1;font-size:12px}.page-title{font-size:52px;letter-spacing:-3px;margin:17px 0}.page-intro{max-width:720px;color:#aaa198;line-height:1.8;font-size:15px}.doc-layout{display:grid;grid-template-columns:210px minmax(0,760px);gap:45px;margin-top:35px}.doc-nav{border-left:1px solid var(--line);padding-left:16px;height:max-content;position:sticky;top:100px}.doc-nav a{display:block;color:#a89f97;font-size:12px;padding:8px 0}.doc-nav a:hover{color:var(--orange)}.article h2{font-size:23px;letter-spacing:-.8px;margin:35px 0 12px}.article p,.article li{color:#b3aaa2;line-height:1.9;font-size:13px}.code{border:1px solid #302a24;border-radius:8px;background:#111;padding:15px;color:#ffb17d;font:12px/1.8 var(--mono);overflow:auto}.note{border-left:2px solid var(--orange);padding:12px 15px;background:#1a130e;color:#c6b6a8;font-size:12px;line-height:1.7;margin:18px 0}.list-links{display:grid;gap:10px;margin-top:25px}.link-row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:17px 18px;border-radius:8px;background:#101010}.link-row:hover{border-color:#694022}.link-row small{display:block;color:var(--muted);margin-top:5px}.arrow{color:var(--orange);font-size:18px}.footer{border-top:1px solid var(--line);padding:25px 5vw;color:#81786f;font:10px var(--mono);display:flex;justify-content:space-between;gap:20px}.footer b{color:var(--orange);font-weight:400}
@media(max-width:900px){.sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:translateX(0);box-shadow:20px 0 70px #0009}main{margin-left:0}.mobile-menu{display:block}.topbar{padding:0 20px}.content{padding:45px 22px 75px}.hero-grid{grid-template-columns:1fr}.terminal{max-width:650px}.cards{grid-template-columns:1fr 1fr}.doc-layout{grid-template-columns:1fr}.doc-nav{position:static;display:flex;flex-wrap:wrap;gap:14px;border-left:0;border-bottom:1px solid var(--line);padding:0 0 13px}.doc-nav a{padding:3px 0}}
@media(max-width:560px){h1{letter-spacing:-3px;font-size:48px}.cards,.split{grid-template-columns:1fr}.page-title{font-size:42px}.content{padding-top:38px}.footer{flex-direction:column}.top-actions .pill{display:none}.terminal pre{font-size:10px;padding:17px}}
</style>
</head>
<body><div class="shell">
<aside class="sidebar" id="sidebar"><a class="brand" href="#/"><span class="mark">A</span>AetherPanel</a>
<div class="nav-label">Workspace</div><nav class="nav" id="nav">
<a href="#/" data-route="/"><span class="ico">⌂</span>Overview</a>
<a href="#/features" data-route="/features"><span class="ico">✳</span>Features</a>
<a href="#/guides" data-route="/guides"><span class="ico">↗</span>Guides</a>
<a href="#/docs" data-route="/docs"><span class="ico">▤</span>Documentation</a>
<a href="#/blog" data-route="/blog"><span class="ico">◷</span>Blog & updates</a>
</nav><div class="nav-label">Project</div><nav class="nav"><a href="https://github.com/MrRangerXD/AetherPanel" target="_blank" rel="noreferrer"><span class="ico">⌘</span>GitHub repository ↗</a><a href="https://panel.znx.indevs.in/" target="_blank" rel="noreferrer"><span class="ico">◉</span>Open panel ↗</a></nav>
<div class="side-bottom">BUILT FOR SELF-HOSTERS<br><a href="https://github.com/MrRangerXD/AetherPanel">SOURCE CODE ↗</a><br>© 2026 AETHERPANEL</div></aside>
<main><header class="topbar"><div style="display:flex;align-items:center;gap:13px"><button class="mobile-menu" id="menu" aria-label="Open navigation">☰</button><div class="crumb">AETHERPANEL <b>/</b> <span id="crumb">OVERVIEW</span></div></div><div class="top-actions"><span class="pill">● BETA PREVIEW</span><a class="github" href="https://github.com/MrRangerXD/AetherPanel" target="_blank" rel="noreferrer">GitHub ↗</a></div></header>
<div id="view" class="content"></div>
<footer class="footer"><span>AETHERPANEL <b>·</b> CONTROL YOUR INFRASTRUCTURE</span><span>OPEN SOURCE PROJECT <b>·</b> 2026</span></footer></main></div>
<script>
const view=document.getElementById('view'),crumb=document.getElementById('crumb'),sidebar=document.getElementById('sidebar');
const pages={
'/':()=>`<div class="hero-grid"><section><div class="eyebrow">MULTI-PLATFORM CONTROL PLANE</div><h1>Your servers.<br><em>Your infrastructure.</em><br>Your control.</h1><p class="lead">AetherPanel is a self-hosted control plane built to bring your server infrastructure into one place. Explore the platform, discover its capabilities, and get started with the guides.</p><div class="actions"><a class="btn primary" href="#/guides">Explore the guides <span>↗</span></a><a class="btn secondary" href="https://github.com/MrRangerXD/AetherPanel" target="_blank">View on GitHub ↗</a></div></section><div class="terminal"><div class="terminal-head"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span> AETHERPANEL / SYSTEM OVERVIEW</span></div><pre><span class="term-dim">$</span> aetherpanel status

<span class="term-orange">◆</span> Control plane
  <span class="term-dim">↳</span> Central management interface

<span class="term-orange">◆</span> Hosting
  <span class="term-dim">↳</span> Minecraft server hosting
  <span class="term-dim">↳</span> Bot hosting

<span class="term-orange">◆</span> Node agent
  <span class="term-dim">↳</span> Server-side execution layer

<span class="term-orange">◆</span> Deployment
  <span class="term-dim">↳</span> Self-hosted infrastructure

<span class="term-orange">●</span> Ready to explore</pre></div></div>
<section class="section"><div class="section-head"><div><div class="eyebrow">EXPLORE AETHERPANEL</div><h2>Everything starts here.</h2><p class="muted">Find your way around the platform and its documentation.</p></div></div><div class="cards">
<a class="card" href="#/features"><div class="card-icon">✳</div><h3>Platform features</h3><p>Discover the capabilities and hosting areas currently represented in AetherPanel.</p></a>
<a class="card" href="#/guides"><div class="card-icon">↗</div><h3>Guides & setup</h3><p>Follow the getting-started path and find useful setup references.</p></a>
<a class="card" href="#/docs"><div class="card-icon">▤</div><h3>Documentation</h3><p>Browse project information, installation entry points and support resources.</p></a></div></section>
<section class="section"><div class="eyebrow">BUILT AROUND YOUR STACK</div><h2>One project. Multiple workloads.</h2><div class="split"><div class="feature-panel"><div class="card-icon">MC</div><h3>Minecraft hosting</h3><p class="muted">AetherPanel includes Minecraft hosting as one of its current hosting categories.</p></div><div class="feature-panel"><div class="card-icon">JS</div><h3>Bot hosting</h3><p class="muted">A dedicated hosting category for bot workloads, alongside Minecraft hosting.</p></div></div></section>`,
'/features':()=>`<div class="eyebrow">CAPABILITIES</div><h1 class="page-title">Made to manage<br><em>your workloads.</em></h1><p class="page-intro">AetherPanel brings server management and node-side execution together in a self-hosted project. These are the core areas highlighted in this beta showcase.</p><div class="cards" style="margin-top:35px">
<div class="card"><div class="card-icon">MC</div><h3>Minecraft hosting</h3><p>Manage Minecraft hosting workloads through the AetherPanel project.</p></div><div class="card"><div class="card-icon">JS</div><h3>Bot hosting</h3><p>Host bot workloads alongside your game server infrastructure.</p></div><div class="card"><div class="card-icon">⌘</div><h3>Node agent</h3><p>A server-side agent is part of the AetherPanel architecture.</p></div><div class="card"><div class="card-icon">▦</div><h3>Self-hosted</h3><p>Run the project on infrastructure you control.</p></div><div class="card"><div class="card-icon">↗</div><h3>Open source</h3><p>Explore the source code, report issues and follow project development on GitHub.</p></div><div class="card"><div class="card-icon">⌁</div><h3>Documentation-led</h3><p>Use the guides and project references to understand setup and operation.</p></div></div><div class="note">This page intentionally lists only high-level capabilities confirmed for this beta. Detailed feature availability depends on the current project release.</div>`,
'/guides':()=>`<div class="eyebrow">LEARN BY DOING</div><h1 class="page-title">Guides & <em>getting started.</em></h1><p class="page-intro">Start with the project installer, then use the repository and your deployment environment as the source of truth for release-specific configuration.</p><div class="list-links">
<a class="link-row" href="#/docs"><span><b>01 · Installation overview</b><small>Installer entry point and repository requirements</small></span><span class="arrow">↗</span></a>
<a class="link-row" href="#/docs#architecture"><span><b>02 · Understand the architecture</b><small>Control plane and node agent overview</small></span><span class="arrow">↗</span></a>
<a class="link-row" href="#/docs#hosting"><span><b>03 · Hosting categories</b><small>Minecraft and bot hosting overview</small></span><span class="arrow">↗</span></a>
<a class="link-row" href="#/docs#support"><span><b>04 · Troubleshooting & support</b><small>Where to report issues and find project updates</small></span><span class="arrow">↗</span></a></div>`,
'/docs':()=>`<div class="eyebrow">DOCUMENTATION</div><h1 class="page-title">The AetherPanel <em>manual.</em></h1><p class="page-intro">A concise starting point for understanding the project. For exact release-specific options, always check the current installer and source in the repository.</p><div class="doc-layout"><nav class="doc-nav"><a href="#install">Installation</a><a href="#architecture">Architecture</a><a href="#hosting">Hosting categories</a><a href="#support">Support</a></nav><article class="article">
<h2 id="install">Installation</h2><p>The repository README provides the installer entry point below. Review the repository and installer before running commands on a production machine.</p><div class="code">curl -fsSL https://mrangerxd.github.io/AetherPanel/install.sh | bash</div><div class="note">Only run installation commands after reviewing the script and confirming that the target machine meets the requirements for your chosen release.</div>
<h2 id="architecture">Architecture overview</h2><p>AetherPanel describes itself as a multi-platform game server control plane and node agent. At a high level, the project includes a central panel and a node-side agent that performs server-side work.</p>
<h2 id="hosting">Hosting categories</h2><p>The current project context for this beta includes two hosting categories:</p><ul><li>Minecraft hosting</li><li>Bot hosting</li></ul><p>Consult the current application and release notes for exact runtime support, resource options and configuration details.</p>
<h2 id="support">Troubleshooting & support</h2><p>If something does not work as expected, collect the relevant logs, note your operating system and project version, and check existing GitHub issues before opening a new report.</p><div class="actions"><a class="btn primary" href="https://github.com/MrRangerXD/AetherPanel/issues" target="_blank">GitHub issues ↗</a><a class="btn secondary" href="https://github.com/MrRangerXD/AetherPanel" target="_blank">Source repository ↗</a></div>
</article></div>`,
'/blog':()=>`<div class="eyebrow">PROJECT JOURNAL</div><h1 class="page-title">Notes from <em>development.</em></h1><p class="page-intro">Release notes, development updates and project announcements will live here as they are published.</p><div class="feature-panel" style="margin-top:35px"><div class="eyebrow">BETA WEBSITE</div><h3>Updates are on the way.</h3><p class="muted">No blog posts have been published on this website yet. Follow the GitHub repository to see actual commits, releases and project changes.</p><div class="actions"><a class="btn primary" href="https://github.com/MrRangerXD/AetherPanel/releases" target="_blank">View releases ↗</a><a class="btn secondary" href="https://github.com/MrRangerXD/AetherPanel" target="_blank">Follow on GitHub ↗</a></div></div>`
};
function render(){let path=location.hash.replace(/^#/, '').split('?')[0]||'/';if(!pages[path])path='/';view.innerHTML=pages[path]();crumb.textContent=({"/":"OVERVIEW","/features":"FEATURES","/guides":"GUIDES","/docs":"DOCUMENTATION","/blog":"BLOG"})[path];document.querySelectorAll('[data-route]').forEach(a=>a.classList.toggle('active',a.dataset.route===path));sidebar.classList.remove('open');if(location.hash.includes('#')){const target=location.hash.split('#').pop();if(target&&document.getElementById(target))setTimeout(()=>document.getElementById(target).scrollIntoView(),40);else window.scrollTo(0,0)}}
window.addEventListener('hashchange',render);document.getElementById('menu').addEventListener('click',()=>sidebar.classList.toggle('open'));render();
</script></body></html>
